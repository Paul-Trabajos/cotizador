<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizador PAUCON</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12355b">
<style>
html,body{height:100%;margin:0;background:#12355b;color:#fff;font-family:system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
a.b{background:#fff;color:#12355b;font-weight:700;padding:16px 32px;border-radius:12px;text-decoration:none;font-size:18px}
p{opacity:.8;margin:0;font-size:14px}
</style></head><body><main>
<img src="icon-192.png" alt="">
<h1 style="margin:0">Cotizador PAUCON</h1>
<a class="b" id="go" href="#">Abrir cotizador</a>
<p id="msg">Abriendo…</p>
</main>
<script>
var URL_APP='https://script.google.com/macros/s/AKfycbzgUC-o5MeqTo9GQVt7VzJb0MuR7C0pCOAs7CN7kztAyR-RGLuobxJojtpmxAuyJ0VjCQ/exec';
document.getElementById('go').href=URL_APP;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone){setTimeout(function(){location.replace(URL_APP)},300);}
else{document.getElementById('msg').textContent='Instala esta página (menú ⋮ → Instalar app) y desde el ícono se abre directo.';}
</script></body></html>
